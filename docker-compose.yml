services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: rat
      MONGO_INITDB_ROOT_PASSWORD: ratpass
      MONGO_INITDB_DATABASE: ratpanel
    volumes:
      - mongodata:/data/db
    ports: ["27017:27017"]

  server:
    build: .
    env_file: .env
    depends_on: [mongo]
    ports: ["8080:8080"]
    volumes:
      - ./storage:/app/storage

volumes:
  mongodata: