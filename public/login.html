<!doctype html>
<html><head><meta charset="utf-8"><title>RAT-PANEL</title></head>
<body style="font-family:sans-serif;max-width:320px;margin:80px auto">
  <h2>RAT-PANEL</h2>
  <input id="u" placeholder="username" style="width:100%;padding:8px;margin-bottom:8px">
  <input id="p" type="password" placeholder="password" style="width:100%;padding:8px;margin-bottom:8px">
  <button id="b" style="width:100%;padding:8px">Login</button>
  <pre id="o"></pre>
  <script>
    b.onclick = async () => {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: u.value, password: p.value })
      });
      const j = await r.json();
      if (j.token) { localStorage.setItem('tok', j.token); location.href = '/index.html'; }
      else o.textContent = JSON.stringify(j);
    };
  </script>
</body></html>
